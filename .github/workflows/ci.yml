name: DevSecOps CI/CD Pipeline with DAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Job 1: Статический анализ (SAST + SCA)
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pytest flake8
      
      - name: Run tests
        run: pytest tests/ -v
      
      - name: Bandit SAST
        run: |
          bandit -r flaskr/ -ll -f json -o bandit-report.json || true
      
      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            trivy-report.json

  # Job 2: Динамический анализ (DAST) с OWASP ZAP
  dast-scan:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Start Flask app
        run: |
          flask --app flaskr run --host=0.0.0.0 --port=5000 &
          sleep 10
      
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk:rw \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -J zap-report.json \
            -r zap-report.html \
            || echo "ZAP scan completed with findings"
      
      - name: Upload DAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: zap-reports/

  # Job 3: Security Gateway
  security-gate:
    runs-on: ubuntu-latest
    needs: [static-analysis, dast-scan]
    if: always()
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: sast-reports/
      
      - name: Download DAST reports
        uses: actions/download-artifact@v4
        with:
          name: dast-reports
          path: dast-reports/
      
      - name: Check for CRITICAL vulnerabilities
        run: |
          if [ -f sast-reports/trivy-report.json ]; then
            CRITICAL_COUNT=$(jq '.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL")' sast-reports/trivy-report.json 2>/dev/null | wc -l)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::Found $CRITICAL_COUNT CRITICAL vulnerabilities!"
              exit 1
            fi
          fi
      
      - name: Security gate passed
        run: echo "✅ All security checks passed!"